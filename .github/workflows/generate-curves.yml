name: Generate Curves

on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Environment (cprod, cstage, cint)'
        required: true
        default: 'cprod'
        type: choice
        options:
          - cprod
          - cstage
          - cint
      region:
        description: 'Region (AMER, EMEAR, APAC)'
        required: true
        default: 'AMER'
        type: choice
        options:
          - AMER
          - EMEAR
          - APAC
      start_date:
        description: 'Start date (ISO format: YYYY-MM-DD)'
        required: false
        default: ''
        type: string
      end_date:
        description: 'End date (ISO format: YYYY-MM-DD)'
        required: false
        default: ''
        type: string
      interval:
        description: 'Aggregation interval in seconds (default 1800 = 30min)'
        required: false
        default: '1800'
        type: string
      aggregation:
        description: 'Aggregation method (mean or sum)'
        required: false
        default: 'mean'
        type: choice
        options:
          - mean
          - sum

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Calculate date range
        id: dates
        run: |
          if [ -z "${{ inputs.start_date }}" ] || [ -z "${{ inputs.end_date }}" ]; then
            END_DATE=$(date -u +%Y-%m-%d)
            START_DATE=$(date -u -v-52d +%Y-%m-%d)
          else
            START_DATE=${{ inputs.start_date }}
            END_DATE=${{ inputs.end_date }}
          fi
          echo "start_date=$START_DATE" >> $GITHUB_OUTPUT
          echo "end_date=$END_DATE" >> $GITHUB_OUTPUT

      - name: Generate curves
        run: |
          python -m load_predictor generate-curves \
            --env ${{ inputs.env }} \
            --region ${{ inputs.region }} \
            --start-date ${{ steps.dates.outputs.start_date }} \
            --end-date ${{ steps.dates.outputs.end_date }} \
            --interval ${{ inputs.interval }} \
            --aggregation ${{ inputs.aggregation }} \
            --output-dir data/curves
        env:
          LP_CONNECTOR_MODE: mock
          LP_WAP_USERNAME: ${{ secrets.WAP_USERNAME }}
          LP_WAP_PASSWORD: ${{ secrets.WAP_PASSWORD }}

      - name: Validate curves
        run: |
          python -m load_predictor validate-curves data/curves/*.json

      - name: Create PR with GitHub App
        run: |
          git config user.name "Load Predictor Bot"
          git config user.email "bot@load-predictor.local"

          BRANCH_NAME="curves/${{ inputs.env }}-${{ inputs.region }}-${{ github.run_id }}"
          REGION_LOWER=$(echo "${{ inputs.region }}" | tr '[:upper:]' '[:lower:]')
          CURVE_FILE="${{ inputs.env }}_${REGION_LOWER}.json"
          CURVE_URL="https://raw.githubusercontent.com/${{ github.repository }}/${BRANCH_NAME}/data/curves/${CURVE_FILE}"
          VISUALIZER_URL="https://vaibhavdesai.github.io/Load-predictor/?curve=${CURVE_URL}"

          git checkout -b ${BRANCH_NAME}
          git add -f data/curves/
          if git commit -m "chore: update curves for ${{ inputs.env }}/${{ inputs.region }}"; then
            git push -u origin ${BRANCH_NAME}
            gh pr create \
              --title "Curve Update: ${{ inputs.env }}/${{ inputs.region }}" \
              --body "Generated curves for **${{ inputs.env }}/${{ inputs.region }}**\n\nData period: ${{ steps.dates.outputs.start_date }} to ${{ steps.dates.outputs.end_date }}\nInterval: ${{ inputs.interval }}s\nAggregation: ${{ inputs.aggregation }}\n\n[📊 View in Load Predictor](${VISUALIZER_URL})\n\nGenerated at: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --head ${BRANCH_NAME}
          fi
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
