name: Generate Curves

on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Environment (cprod, cstage, cint)'
        required: true
        default: 'cprod'
        type: choice
        options:
          - cprod
          - cstage
          - cint
      region:
        description: 'Region (AMER, EMEAR, APAC)'
        required: true
        default: 'AMER'
        type: choice
        options:
          - AMER
          - EMEAR
          - APAC
      weeks_back:
        description: 'Number of weeks of data'
        required: true
        default: '52'
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Generate curves
        run: |
          python -m load_predictor generate-curves \
            --env ${{ inputs.env }} \
            --region ${{ inputs.region }} \
            --weeks-back ${{ inputs.weeks_back }} \
            --output-dir data/curves
        env:
          # Use mock mode by default (no credentials needed)
          LP_CONNECTOR_MODE: mock
          # Optional: Use production WAP if credentials available
          LP_WAP_USERNAME: ${{ secrets.WAP_USERNAME }}
          LP_WAP_PASSWORD: ${{ secrets.WAP_PASSWORD }}

      - name: Validate curves
        run: |
          python -m load_predictor validate-curves data/curves/*.json

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Build visualization
        run: |
          cd viz
          npm install
          npm run build

          # Copy built files to /docs for GitHub Pages
          mkdir -p ../docs
          cp -r dist/* ../docs/

      - name: Create Pull Request with curves
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update curves for ${{ inputs.env }}/${{ inputs.region }}'
          title: 'Curve Update: ${{ inputs.env }}/${{ inputs.region }}'
          body: |
            Automated curve generation

            **Environment:** ${{ inputs.env }}
            **Region:** ${{ inputs.region }}
            **Data period:** Last ${{ inputs.weeks_back }} weeks

            Generated at: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          branch: curves/${{ inputs.env }}-${{ inputs.region }}-${{ github.run_id }}
          delete-branch: true

      - name: Deploy visualization to main
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: deploy visualization for ${{ inputs.env }}/${{ inputs.region }}'
          title: 'Deploy: Update visualization for ${{ inputs.env }}/${{ inputs.region }}'
          body: |
            Auto-generated visualization update

            **Updated:** /docs for GitHub Pages
            **Environment:** ${{ inputs.env }}
            **Region:** ${{ inputs.region }}
          branch: deploy/visualization-${{ inputs.env }}-${{ inputs.region }}-${{ github.run_id }}
          delete-branch: true
