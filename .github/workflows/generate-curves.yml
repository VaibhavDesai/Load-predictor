name: Generate Curves

on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Environment (cprod, cstage, cint)'
        required: true
        default: 'cprod'
        type: choice
        options:
          - cprod
          - cstage
          - cint
      region:
        description: 'Region (AMER, EMEAR, APAC)'
        required: true
        default: 'AMER'
        type: choice
        options:
          - AMER
          - EMEAR
          - APAC
      weeks_back:
        description: 'Number of weeks of data'
        required: true
        default: '52'
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Generate curves
        run: |
          python -m load_predictor generate-curves \
            --env ${{ inputs.env }} \
            --region ${{ inputs.region }} \
            --weeks-back ${{ inputs.weeks_back }} \
            --output-dir data/curves
        env:
          LP_CONNECTOR_MODE: mock
          LP_WAP_USERNAME: ${{ secrets.WAP_USERNAME }}
          LP_WAP_PASSWORD: ${{ secrets.WAP_PASSWORD }}

      - name: Validate curves
        run: |
          python -m load_predictor validate-curves data/curves/*.json

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Build visualization
        run: |
          cd viz
          npm install
          npm run build
          mkdir -p ../docs
          cp -r dist/* ../docs/

      - name: Create PRs with GitHub App
        run: |
          git config user.name "Load Predictor Bot"
          git config user.email "bot@load-predictor.local"

          # Create curves branch and PR
          BRANCH_NAME="curves/${{ inputs.env }}-${{ inputs.region }}-${{ github.run_id }}"
          REGION_LOWER=$(echo "${{ inputs.region }}" | tr '[:upper:]' '[:lower:]')
          CURVE_FILE="${{ inputs.env }}_${REGION_LOWER}.json"
          CURVE_URL="https://raw.githubusercontent.com/${{ github.repository }}/${BRANCH_NAME}/data/curves/${CURVE_FILE}"
          VISUALIZER_URL="https://vaibhavdesai.github.io/Load-predictor/?curve=${CURVE_URL}"

          git checkout -b ${BRANCH_NAME}
          git add -f data/curves/
          if git commit -m "chore: update curves for ${{ inputs.env }}/${{ inputs.region }}"; then
            git push -u origin ${BRANCH_NAME}
            gh pr create \
              --title "Curve Update: ${{ inputs.env }}/${{ inputs.region }}" \
              --body "Generated curves for **${{ inputs.env }}/${{ inputs.region }}**\n\nData period: Last ${{ inputs.weeks_back }} weeks\n\n[📊 View in Load Predictor](${VISUALIZER_URL})\n\nGenerated at: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --head ${BRANCH_NAME}
          fi

          # Create visualization branch and PR
          git checkout main
          git checkout -b deploy/visualization-${{ inputs.env }}-${{ inputs.region }}-${{ github.run_id }}
          git add -f docs/
          if git commit -m "chore: deploy visualization for ${{ inputs.env }}/${{ inputs.region }}"; then
            git push -u origin deploy/visualization-${{ inputs.env }}-${{ inputs.region }}-${{ github.run_id }}
            gh pr create \
              --title "Deploy: Update visualization for ${{ inputs.env }}/${{ inputs.region }}" \
              --body "Updated visualization in /docs for GitHub Pages\n\nEnvironment: ${{ inputs.env }}\nRegion: ${{ inputs.region }}" \
              --head deploy/visualization-${{ inputs.env }}-${{ inputs.region }}-${{ github.run_id }}
          fi
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
