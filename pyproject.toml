[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "load-predictor"
version = "2.0.0"
description = "Load prediction system for capacity scheduling"
authors = [{name = "Vaibhav Desai"}]
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "mysql-connector-python>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]
viz = [
    "matplotlib>=3.7.0",
]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
python_files = ["test_*.py"]

[tool.black]
line-length = 100
target-version = ['py310']
